name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint, audit and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Audit dependencies
        run: npm audit --audit-level=high

      # Tests use the mock client and fake HTTP transports: no CoinGecko key
      # or network access is needed.
      - name: Run tests
        run: npm test
